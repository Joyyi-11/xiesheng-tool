# 回归防线：push / PR 时跑单元测试。
#
# 只跑「不依赖 ASR 栈」的部分。funasr / torch / diarize 在 CI 里安装超过 1GB，
# 而整套用例里只有 2 个真正需要它们，因此按用例 deselect，而不是整体
# 跳过某个测试文件——新增的重依赖用例应当让 CI 红一次，提醒把它登记到这里。
# 依赖按「测试实际 import 到的第三方包」显式列出：bs4 / numpy 是测试直接 import；
# httpx 是 tests/test_processor.py 顶层 import（openai 的传递依赖，本地有、CI 干净环境没有，
# 故必须显式装）；requests / python-dotenv 是函数内 import。
#
# 未接入 ruff：src/ 现有存量违规，直接接入会让 CI 常年红。
# 清理或收窄 pyproject 的 lint 范围后再加一步。

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装轻量依赖（不含 funasr / torch / diarize）
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8.0" \
            "pydantic>=2.0" \
            "openai>=1.0" \
            "requests>=2.28" \
            "beautifulsoup4>=4.12" \
            "python-dotenv>=1.0" \
            "httpx>=0.27" \
            numpy

      - name: 单元测试
        run: |
          pytest -q \
            --deselect "tests/test_transcriber.py::TestModelValidation::test_sensevoice_passes_punc_model_to_spk_model" \
            --deselect "tests/test_diarization_backend.py::test_wespeaker_forces_external_diarize"
