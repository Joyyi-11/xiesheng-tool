[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiesheng"
version = "0.1.0"
description = "撷声：面向小宇宙播客的结构化 Markdown 文稿生成工具"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    # funasr 依赖 torch；无 GPU 的机器建议先安装 CPU 版 torch 再装本项目：
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "funasr>=1.0",
    "diarize>=0.1.2",
]

[project.scripts]
xiesheng = "src.main:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N"]
"src/processor/prompt.py" = ["E501"]
"src/processor/session_edit.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
